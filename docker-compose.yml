services:
  db:
    image: postgres:15
    container_name: aviation_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ourairports
    ports:
      - "54321:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql_scripts:/docker-entrypoint-initdb.d
      - ./data:/csv_data

volumes:
  db_data: